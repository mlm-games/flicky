name: Android App Releases
on:
  workflow_dispatch:
    inputs:
      upload_releases:
        description: 'Upload releases'
        required: true
        default: true
        type: boolean
      mark_prerelease:
        description: 'Mark as prerelease'
        required: true
        default: false
        type: boolean
      # play_track:
      #   description: 'Google Play track'
      #   required: true
      #   default: 'alpha'
      #   type: choice
      #   options: [internal, alpha, beta, production]
      # bump_type:
      #   description: 'Ver bump type'
      #   required: true
      #   default: 'patch'
      #   type: choice
      #   options: [patch, minor, major]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: mlm-games/ci/.github/workflows/android-release.yml@v1
    with:
      app-name: Flicky
      app-slug: flicky
      application-id: app.flicky
      auto-bump-version: true
      # play-track: ${{ inputs.play_track || 'alpha' }}
    secrets:
      KEYSTORE: ${{ secrets.KEYSTORE }}
      KEYSTORE_PASSPHRASE: ${{ secrets.KEYSTORE_PASSPHRASE }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
